[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uml-runner"
version = "0.2.0"
description = "Run NixOS systems under User-Mode Linux and drive them from Python"
requires-python = ">=3.10"
dependencies = ["rpyc"]

[project.scripts]
run-uml = "uml_runner.cli:main"
uml-agent = "uml_runner.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["uml_runner"]

# PEP 561. A test script lives in the project under test, not here, and
# that project type checks it -- so the annotations have to survive the
# install or pyright reads every `vms.node` as Unknown.
artifacts = ["uml_runner/py.typed"]
