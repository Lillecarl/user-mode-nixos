# Generated from ci/workflows.nix -- do not edit.
# Run `nix run .#render-workflows` after changing the workflow.
env:
  UMBRELLA_GIT: "1"
jobs:
  checks:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',checks,'))
    needs:
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Check the generated files, the scripts, the images and the kubeadm config
        run: nix build --no-link --print-build-logs --keep-going --file . check-workflows check-scripts check-k8s-images check-k8s-config
        timeout-minutes: 20
    timeout-minutes: 30
  kernel:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: (github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',kernel,'))
    needs:
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Build the UML kernel
        run: nix build --no-link --print-build-logs --keep-going --file . umlKernel
        timeout-minutes: 45
    timeout-minutes: 60
  test-containerd:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-containerd,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run containerd: a container runs, out of the host''s store'
        run: nix build --no-link --print-build-logs --keep-going --file . containerd
        timeout-minutes: 35
    timeout-minutes: 45
  test-forward:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-forward,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run forward: the host reaches a service inside a guest'
        run: nix build --no-link --print-build-logs --keep-going --file . forward
        timeout-minutes: 35
    timeout-minutes: 45
  test-fuse:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-fuse,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run fuse: a userspace filesystem, as root and as a user'
        run: nix build --no-link --print-build-logs --keep-going --file . fuse
        timeout-minutes: 5
    timeout-minutes: 15
  test-iperf:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-iperf,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run iperf: what a segment between two guests carries'
        run: nix build --no-link --print-build-logs --keep-going --file . iperf
        timeout-minutes: 35
    timeout-minutes: 45
  test-k8s:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (needs.test-containerd.result == ''success'' || needs.test-containerd.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-k8s,''))'
    needs:
      - kernel
      - test-containerd
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - name: Make room on the runner
        run: |
          df -h /
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox
          docker system prune --all --force
          docker builder prune --all --force
          df -h /
        timeout-minutes: 10
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run k8s: a three-node kubeadm cluster'
        run: nix build --no-link --print-build-logs --keep-going --file . k8s
        timeout-minutes: 110
    timeout-minutes: 120
  test-k8s-pull:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-k8s-pull,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        timeout-minutes: 5
      - name: 'Run k8s-pull: a node that pulls its images, on a virtual machine'
        run: nix run --print-build-logs --file . k8s-pull.run
        timeout-minutes: 20
    timeout-minutes: 30
  test-lan:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-lan,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run lan: two guests on a segment see each other'
        run: nix build --no-link --print-build-logs --keep-going --file . lan
        timeout-minutes: 35
    timeout-minutes: 45
  umbrella-rev:
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: resolve
        name: Resolve the umbrella revision
        run: ci/walkback.sh https://github.com/nixidae/nixidae user-mode-nixos | sed 's/^/rev=/' >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
name: CI
on:
  pull_request: {}
  push: {}
  workflow_dispatch:
    inputs:
      jobs:
        default: ""
        description: Comma-separated job IDs to run; empty runs all of them
        required: false
        type: string
